services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: besafe
      POSTGRES_PASSWORD: besafe
      POSTGRES_DB: besafe
    ports:
      - "5432:5432"
    volumes:
      - besafe_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U besafe -d besafe"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - besafe_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://besafe:besafe@postgres:5432/besafe
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-please-change-me-in-prod-32chars
      JWT_REFRESH_SECRET: dev-refresh-secret-please-change-me-in-prod-32chars
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      MONO_BASE_URL: https://api.withmono.com
      MONO_SECRET_KEY: sk_test_replace
      VERIFYME_BASE_URL: https://api.verified.africa
      VERIFYME_USER_ID: replace
      VERIFYME_API_KEY: replace
      FEATURE_STUB_IDENTITY_PROVIDERS: "true"
      FEATURE_STUB_SMS: "true"
      LOG_LEVEL: debug
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  besafe_pg_data:
  besafe_redis_data:
